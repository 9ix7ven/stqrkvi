<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        p {
            color: #999;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>APS</h1>

        <p>Welcome to my page.</p>

        <a href="https://stqrkvi.lol" class="button">
            Main Website
        </a>
    </div>

</body>
</html>
